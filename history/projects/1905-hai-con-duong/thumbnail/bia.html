<!doctype html>
<!-- Bìa 1080x1920 kiểu "poster tối nửa trên" (người dùng chọn theo mẫu Sử Ký Quán Cóc, 2026-11-15).
     Chụp: chrome --headless=new --screenshot=out.png --window-size=1080,1920 "file:///.../bia.html?bg=nen.jpg"
     Nội dung chữ sửa trong khối .box bên dưới. Người dùng bỏ nhãn "TẬP N" và dòng tên series/năm (2026-11-15). -->
<html lang="vi"><head><meta charset="utf-8">
<style>
@font-face { font-family: "AlegreyaSC"; src: url("../../../assets/fonts/AlegreyaSC-Bold.ttf"); font-weight: 700; }
@font-face { font-family: "Alegreya"; src: url("../../../assets/fonts/Alegreya-VF.ttf"); font-weight: 400 900; }
html, body { margin: 0; width: 1080px; height: 1920px; overflow: hidden; background: #000; }
.bg { position: absolute; inset: 0; background-size: cover; background-position: center bottom; }
/* nửa trên tối dần để chữ nổi, như mẫu */
.shade { position: absolute; inset: 0; background: linear-gradient(to bottom, rgba(0,0,0,.92) 0%, rgba(0,0,0,.85) 30%, rgba(0,0,0,.35) 48%, rgba(0,0,0,0) 60%); }
.box { position: absolute; left: 64px; top: 300px; width: 950px; color: #F3E6C8; }
.tag { position: relative; isolation: isolate; display: inline-block; padding: 12px 42px 10px; font: 700 44px "AlegreyaSC"; letter-spacing: 6px; color: #FFF6E6; }
.tag svg { position: absolute; inset: -6px -10px; width: calc(100% + 20px); height: calc(100% + 12px); z-index: -1; }
.t1, .t2 { font: 700 96px/1.02 "AlegreyaSC"; letter-spacing: 1px; text-shadow: 0 4px 12px rgba(0,0,0,.8); }
.t1 { margin-top: 0; color: #F6EBD3; }
.t2 { color: #E8B54A; }
.rule { display: flex; align-items: center; gap: 18px; width: 470px; margin: 26px 0 22px; color: #C9973A; }
.rule i { flex: 1; height: 3px; background: linear-gradient(to right, transparent, #C9973A 20%, #C9973A 80%, transparent); }
.rule b { font: 34px/1 serif; }
.part { font: 700 40px "AlegreyaSC"; letter-spacing: 6px; color: #E0A93E; }
.sub { margin-top: 6px; font: 500 52px/1.16 "Alegreya"; color: #F3E6C8; text-shadow: 0 3px 10px rgba(0,0,0,.8); }
.chan { display: flex; align-items: center; gap: 20px; margin-top: 28px; }
.chan img { width: 84px; height: 84px; border-radius: 50%; border: 3px solid #C9973A; background: #F3E6C8; }
.chan span { font: 700 36px "AlegreyaSC"; letter-spacing: 4px; color: #E0B860; }
</style></head>
<body>
<div class="bg" id="bg"></div><div class="shade"></div>
<div class="box">
  <div class="t1" id="t1">KINH THÀNH HUẾ</div>
  <div class="t2" id="t2">CHIẾU CẦN VƯƠNG</div>
  <div class="rule"><i></i><b>✦</b><i></i></div>
  <div class="sub" id="sub">Điều gì khiến vua Hàm Nghi<br>bỏ ngai vàng giữa đêm?</div>
  <div class="chan"><img src="../../../assets/brand/logo.png" alt=""><span>VY KỂ CHUYỆN SỬ</span></div>
</div>
<script>
const q = new URLSearchParams(location.search);
document.getElementById("bg").style.backgroundImage = `url("${q.get("bg") || "nen-1-sach.jpg"}")`;
for (const k of ["t1", "t2", "sub"]) if (q.get(k)) document.getElementById(k).innerHTML = q.get(k);
// 1905: shift = push the picture down (px) so faces sit below the text; fs = title font size (px)
if (q.get("shift")) { const b = document.getElementById("bg").style; b.top = q.get("shift") + "px"; b.bottom = -q.get("shift") + "px"; }
if (q.get("fs")) for (const k of ["t1", "t2"]) document.getElementById(k).style.fontSize = q.get("fs") + "px";
</script>
</body></html>
